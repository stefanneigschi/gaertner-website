# Statische Website – kein Build-Schritt nötig, ausgeliefert wird ./dist
[build]
  publish = "dist"
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Alte URLs ohne abschließenden Schrägstrich und Sonderfälle
[[redirects]]
  from = "/seesophie"
  to = "https://seesophie.at/"
  status = 301
  force = true
